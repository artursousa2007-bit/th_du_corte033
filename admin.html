<!doctype html><html lang=pt-BR><meta name=viewport content="width=device-width,initial-scale=1"><title>Área do Barbeiro</title><style>body{background:#090909;color:#fff;font-family:Arial;margin:0}.w{max-width:1000px;margin:auto;padding:20px}.c{background:#121212;border:1px solid #333;border-radius:18px;padding:20px;margin:15px 0}input,button{padding:13px;width:100%;box-sizing:border-box;margin:6px 0;border-radius:10px}input{background:#191919;color:#fff;border:1px solid #444}button{background:#e00020;color:#fff;border:0;font-weight:bold}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#191919;padding:15px;border-radius:10px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}td,th{padding:10px;border-bottom:1px solid #333;text-align:left}.ok{color:#7f9}@media(max-width:600px){.g{grid-template-columns:1fr}}</style>
<div class=w><h1>TH_DU_CORTE033</h1><div id=l class=c><h2>🔐 Área do Barbeiro</h2><input id=p type=password placeholder="Senha"><button onclick=login()>Entrar</button><p id=x></p></div><div id=a class=c style=display:none><button onclick=out()>Sair</button><div class=g><div class=stat>Agendamentos <b id=t></b></div><div class=stat>Pagos <b id=pa></b></div><div class=stat>Receita <b id=r></b></div></div><div class=scroll><table><thead><tr><th>Cliente</th><th>WhatsApp</th><th>Serviço</th><th>Data</th><th>Hora</th><th>Valor</th><th>Status</th></tr></thead><tbody id=z></tbody></table></div></div></div>
<script>
let tok=localStorage.thduToken;async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("p").value})}),a=await r.json();if(!r.ok)return $("x").textContent=a.error;localStorage.thduToken=tok=a.token;show()}function $(x){return document.getElementById(x)}function out(){localStorage.removeItem("thduToken");location.reload()}async function show(){if(!tok)return;$("l").style.display="none";$("a").style.display="block";let h={Authorization:"Bearer "+tok},s=await fetch("/api/admin/summary",{headers:h}).then(r=>r.json()),d=await fetch("/api/admin/bookings",{headers:h}).then(r=>r.json());$("t").textContent=s.total;$("pa").textContent=s.paid;$("r").textContent="R$ "+Number(s.revenue).toFixed(2).replace(".",",");$("z").innerHTML=d.map(x=>`<tr><td>${x.customer_name}</td><td>${x.whatsapp}</td><td>${x.service}</td><td>${x.appointment_date}</td><td>${x.appointment_time}</td><td>R$ ${x.price}</td><td class="${x.status==="approved"?"ok":""}">${x.payment_status||x.status}</td></tr>`).join("")}show();
</script>
