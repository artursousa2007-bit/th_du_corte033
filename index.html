<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TH_DU_CORTE033</title>
<style>body{margin:0;background:#090909;color:#fff;font-family:Arial}.w{max-width:700px;margin:auto;padding:20px}.c{background:#121212;border:1px solid #333;border-radius:18px;padding:20px;margin:15px 0}input,select,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #444;background:#191919;color:#fff}button{background:#e00020;border:0;font-weight:bold}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.slot{margin:0;background:#292929}.sel{background:#e00020}.blocked{color:#666;background:#151515}.qr{max-width:280px;background:#fff;padding:8px}.copy{word-break:break-all;background:#191919;padding:12px;border-radius:10px}</style>
<div class=w><h1>TH_DU_CORTE033</h1><div class=c><h2>Agendamento + Pix</h2><select id=s></select><input id=d type=date><div id=slots class=slots></div><input id=n placeholder="Nome"><input id=w placeholder="WhatsApp"><input id=e type=email placeholder="E-mail"><button onclick=pay()>Gerar Pix</button><p id=m></p></div><div id=p class=c style=display:none><h2>Pagamento Pix</h2><div id=q></div><div id=c class=copy></div><p id=st>Aguardando pagamento...</p></div></div>
<script>
let t=null;const $=x=>document.getElementById(x);const msg=x=>$("m").textContent=x;
async function init(){let a=await fetch("/api/services").then(r=>r.json());$("s").innerHTML=Object.entries(a).map(x=>`<option>${x[0]} — R$ ${x[1]}</option>`).join("");let z=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$("d").value=z;$("d").min=z;slots()}
async function slots(){t=null;let a=await fetch("/api/slots?date="+$("d").value).then(r=>r.json()),b=new Set(a.blocked||[]),h="";for(let x=8;x<=20;x++)for(let y of[0,30]){if(x==20&&y==30)continue;let z=String(x).padStart(2,"0")+":"+String(y).padStart(2,"0"),off=b.has(z);h+=`<button type=button class="slot ${off?"blocked":""}" ${off?"disabled":""} onclick="pick('${z}',this)">${z}</button>`}$("slots").innerHTML=h}
function pick(x,b){t=x;document.querySelectorAll(".slot").forEach(z=>z.classList.remove("sel"));b.classList.add("sel")}
async function pay(){if(!t)return msg("Escolha um horário.");let service=$("s").value.split(" — R$ ")[0];let r=await fetch("/api/bookings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("n").value,whatsapp:$("w").value,email:$("e").value,service,date:$("d").value,time:t})}),a=await r.json();if(!r.ok)return msg(a.error);$("p").style.display="block";$("c").textContent=a.qrCode||"";if(a.qrCodeBase64)$("q").innerHTML=`<img class=qr src="data:image/png;base64,${a.qrCodeBase64}">`;poll(a.bookingId)}
async function poll(id){let a=await fetch("/api/bookings/"+id+"/status").then(r=>r.json());if(a.status==="approved")return $("st").textContent="✅ Pix pago. Horário confirmado!";if(["canceled","expired"].includes(a.status))return $("st").textContent="❌ Pagamento não aprovado.";setTimeout(()=>poll(id),4000)}
$("d").onchange=slots;init();
</script>
